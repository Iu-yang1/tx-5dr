name: Stage one-time upstream merge without release

on:
  push:
    branches: ['sync/boybook-main-20261110']
    paths: ['.github/workflows/one-time-upstream-merge.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge exact reviewed upstream main with fork precedence only on conflicting hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/boybook/tx-5dr.git main
          test "$(git rev-parse FETCH_HEAD)" = 'd0f1c3165ca4aaebd01d1450d174b5f5314c1d8c'
          ORIGINAL="$(git rev-parse HEAD)"
          if ! git merge --no-commit --no-ff -X ours FETCH_HEAD; then
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ "$UNMERGED" != '.github/workflows/release.yml' ]; then
              git status --short
              echo "Unexpected unresolved paths: $UNMERGED" >&2
              exit 1
            fi
            git rm -f -- .github/workflows/release.yml
          fi
          # GitHub Actions token lacks the 'workflows' privilege. Keep the
          # fork's npm-release workflow identical in this merge, then use
          # a separate authorized API change if it needs reconciliation.
          git restore --source="$ORIGINAL" --staged --worktree -- .github/workflows/npm-publish.yml
          git -c core.editor=true commit -m 'chore(upstream): integrate boybook/tx-5dr [skip release]'
          # Keep this single-use file unchanged for the restricted GITHUB_TOKEN
          # push; delete it with repository-owner credentials afterward.
          git log -2 --oneline
          git push origin HEAD:refs/heads/sync/boybook-main-20261110
