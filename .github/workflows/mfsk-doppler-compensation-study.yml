name: Explicit Doppler tracking versus uncompensated Watterson study

on:
  push:
    branches: [integration/mfsk-core-v0.15.1-p9]
    paths: ['.github/workflows/mfsk-doppler-compensation-study.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-rate:
    name: ${{ matrix.mode }} 1Hz fading, ${{ matrix.doppler }}Hz/s deramp
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [FT8, FT4]
        doppler: [10, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit-test finite-tap analytic Doppler correction
        shell: bash
        run: node --test packages/mfsk-native/watterson-channel.test.cjs
      - name: Build and smoke exact SHA Rust NAPI codec
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path packages/mfsk-native/Cargo.toml --release
          cp packages/mfsk-native/target/release/libtx5dr_mfsk_native.so packages/mfsk-native/mfsk-native.node
          node packages/mfsk-native/smoke.cjs
      - name: Install test-only independent WSJT-X reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libpulse-dev libhamlib-dev libhamlib4 libopus-dev build-essential python3-dev pkg-config
          corepack enable
          corepack prepare yarn@4.9.1 --activate
          yarn install --immutable --mode=skip-build
          npm rebuild wsjtx-lib --no-save --foreground-scripts
      - name: Strict paired known-rate Doppler threshold, 80 trials per SNR
        env:
          MFSK_MODE: ${{ matrix.mode }}
          MFSK_CHANNEL: watterson
          MFSK_SPREAD_HZ: '1'
          MFSK_DOPPLER_RATE: ${{ matrix.doppler }}
          MFSK_DOPPLER_TRACKING: known-rate-ideal
        shell: bash
        run: node packages/server/scripts/watterson-strict-acceptance.cjs
      - name: Preserve raw threshold evidence on failed or inconclusive cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-rate-watterson-${{ matrix.mode }}-${{ matrix.doppler }}hzps-${{ github.sha }}
          path: packages/server/scripts/reference-threshold-*.json
          if-no-files-found: warn
          retention-days: 30
