name: Full Dynamic Radio and Performance Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-radio-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.1 --activate
      - name: Install native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libpulse-dev libhamlib-dev libhamlib4 libopus-dev build-essential python3-dev pkg-config
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all packages
        run: yarn build
      - name: Measure isolated Hamlib IPC control and spectrum overhead
        run: |
          /usr/bin/time -v yarn workspace @tx5dr/server exec vitest run src/radio/connections/hamlib/__tests__/ProcessHamlibTransport.performance.test.ts --maxWorkers=1 --minWorkers=1
      - name: Run full backend unit suite in fresh Vitest shard processes
        run: |
          set -o pipefail
          failures=0
          for shard in $(seq 1 8); do
            echo "::group::Backend unit shard ${shard}/8"
            /usr/bin/time -v yarn workspace @tx5dr/server exec vitest run --shard="${shard}/8" --maxWorkers=1 --minWorkers=1 --exclude 'src/**/*.performance.test.ts' || failures=$((failures+1))
            echo "::endgroup::"
          done
          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} backend unit shard(s) failed"
            exit 1
          fi
      - name: Run real-codec virtual radio and decoder integration
        if: always()
        run: |
          /usr/bin/time -v yarn workspace @tx5dr/server test:virtual-radio-integration
      - name: Run logbook 70K-record performance regression
        if: always()
        run: |
          /usr/bin/time -v yarn workspace @tx5dr/server test:logbook-performance

  other-workspaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.1 --activate
      - name: Install native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libpulse-dev libhamlib-dev libhamlib4 libopus-dev build-essential python3-dev pkg-config
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all packages
        run: yarn build
      - name: Run remaining workspace test suites
        run: |
          /usr/bin/time -v yarn turbo run test --filter='!@tx5dr/server' --concurrency=2
