name: Focused Radio Regression Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'integration/**' ]

concurrency:
  # Both integration push and PR check the same commit; run one current suite.
  group: radio-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libpulse-dev libhamlib-dev libhamlib4 libopus-dev build-essential python3-dev pkg-config
      - name: Install dependencies
        # CI is CPU-only. Avoid optional CUDA NuGet downloads which can time out
        # and incorrectly fail the build before any tests execute.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Verify Caddy/FRP trust boundary, independently of the DSP backend
        run: node --test packages/client-tools/src/proxyForwarding.test.mjs
      - name: Verify Electron FRP process isolation and configuration
        run: cd packages/electron-main && yarn exec vitest run src/__tests__/publicTunnel.test.ts --maxWorkers=1
      - name: Verify generated FRPC config with official legacy v0.71.1 parser
        run: |
          set -euo pipefail
          VERSION=0.71.1
          ARCHIVE="frp_${VERSION}_linux_amd64.tar.gz"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          BASE="https://github.com/fatedier/frp/releases/download/v${VERSION}"
          curl -fsSL --retry 3 "${BASE}/${ARCHIVE}" -o "$TMP/${ARCHIVE}"
          curl -fsSL --retry 3 "${BASE}/frp_sha256_checksums.txt" -o "$TMP/checksums"
          SHA="$(awk -v filename="$ARCHIVE" '$NF == filename {print $1}' "$TMP/checksums" | head -n 1)"
          test "${#SHA}" -eq 64
          echo "$SHA  $TMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          export TX5DR_FRPC_TEST_CONFIG="$TMP/frpc.toml"
          node <<'NODE'
          const fs = require('node:fs');
          const { DEFAULT_PUBLIC_TUNNEL_SETTINGS, renderFrpcToml } =
            require('./packages/electron-main/dist/publicTunnel.js');
          const toml = renderFrpcToml({
            ...DEFAULT_PUBLIC_TUNNEL_SETTINGS,
            frpcPath: '/tmp/frpc',
            serverHost: 'langd.space',
            publicHost: 'langd.space',
            localWebIP: '192.168.1.5',
            localWebPort: 10443,
            remoteWebPort: 18443,
            localUdpIP: '192.168.1.5',
            localUdpPort: 50110,
            remoteUdpPort: 18444,
            webProxyName: 'jvm-tx5dr-web',
            rtcUdpProxyName: 'jvm-tx5dr-rtc-udp',
            logLevel: 'info',
          }, 'fixture-token', 8076);
          if (toml.includes('useSystemCa') || toml.includes('trustedCaFile')) throw new Error('unexpected TLS CA parameter');
          if (!toml.includes('name = "jvm-tx5dr-web"') ||
              !toml.includes('name = "jvm-tx5dr-rtc-udp"') ||
              !toml.includes('localPort = 10443') ||
              !toml.includes('remotePort = 18444')) throw new Error('field-tested proxy settings missing');
          fs.writeFileSync(process.env.TX5DR_FRPC_TEST_CONFIG, toml, { mode: 0o600 });
          NODE
          "$TMP/frp_${VERSION}_linux_amd64/frpc" verify -c "$TX5DR_FRPC_TEST_CONFIG"
      - name: Verify locale parity
        run: yarn check:i18n
      - name: Focused Web tests
        run: |
          set -euo pipefail
          cd packages/web
          TESTS=(
            src/pages/about/MfskLiveReceiverPanel.test.tsx
            src/audio/__tests__/softwareSquelchPreference.test.ts
            src/components/common/__tests__/QrzCallsignLink.test.ts
            src/components/radio/control/__tests__/RadioControlPluginToolbar.test.ts
            src/components/radio/profile/__tests__/audioDeviceDisplay.test.ts
          )
          EXISTING=()
          for f in "${TESTS[@]}"; do if test -f "$f"; then EXISTING+=("$f"); fi; done
          if test ${#EXISTING[@]} -eq 0; then exit 1; fi
          yarn exec vitest run "${EXISTING[@]}" --maxWorkers=2

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libpulse-dev libhamlib-dev libhamlib4 libopus-dev build-essential python3-dev pkg-config
      - name: Install dependencies
        # CI is CPU-only. Avoid optional CUDA NuGet downloads which can time out
        # and incorrectly fail the build before any tests execute.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Focused Backend tests
        run: |
          set -euo pipefail
          cd packages/server
          TESTS=(
            src/realtime/__tests__/RtcTurnCredentials.test.ts
            src/decode/__tests__/MfskLiveRxService.test.ts
            src/utils/__tests__/frequencyMHz.test.ts
            src/audio/__tests__/AudioHotplugRecovery.test.ts
            src/config/__tests__/ConfigManager.audioIdentity.test.ts
            src/radio/connections/__tests__/NullConnection.standalonePtt.test.ts
            src/radio/connections/__tests__/NullConnection.standalonePtt.test.ts
            src/radio/__tests__/HamlibConnection.test.ts
            src/radio/__tests__/PhysicalRadioManager.test.ts
            src/operator/__tests__/RadioOperatorManager.test.ts
            src/plugin/__tests__/PluginManager.standard-qso.test.ts
            src/decode/__tests__/NativeAutoTxScheduler.test.ts
            src/decode/__tests__/MfskNativeTxService.test.ts
            src/decode/__tests__/CallsignHashRegistry.test.ts
            src/decode/__tests__/MfskDecodeWorkerCore.test.ts
            src/decode/__tests__/WSJTXDecodeProcessPool.lifecycle.test.ts
            src/subsystems/__tests__/TransmissionPipeline.test.ts
            src/subsystems/__tests__/RadioBridge.test.ts
            src/__tests__/DigitalRadioEngine.mode-switch.test.ts
            src/radio/connections/hamlib/__tests__/HamlibNativeMonitor.test.ts
            src/radio/connections/hamlib/__tests__/LocalHamlibTransport.test.ts
            src/radio/connections/hamlib/__tests__/ProcessHamlibTransport.test.ts
            src/radio/connections/hamlib/__tests__/hamlib-protocol.test.ts
          )
          EXISTING=()
          for f in "${TESTS[@]}"; do if test -f "$f"; then EXISTING+=("$f"); fi; done
          if test ${#EXISTING[@]} -eq 0; then exit 1; fi
          yarn exec vitest run "${EXISTING[@]}" --maxWorkers=2
