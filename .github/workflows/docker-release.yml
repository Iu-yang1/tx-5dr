name: Build and Release Docker Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'release/official-version.txt'
      - '.github/workflows/official-release-dispatch.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (leave empty for auto-generated)'
        required: false
        default: ''

concurrency:
  # Keep the latest PR validation; never cancel an official release dispatch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  DOCKER_IMAGE_NAME: tx-5dr
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BASE_URL: ${{ secrets.OSS_BASE_URL }}
      OSS_REGION: ${{ secrets.OSS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate image tags
        id: tags
        run: |
          # Docker Hub is optional. If credentials are absent, publish to GHCR
          # using the repository-scoped GITHUB_TOKEN rather than a placeholder.
          DOCKER_USERNAME="${{ secrets.DOCKER_HUB_USERNAME }}"
          DOCKER_TOKEN="${{ secrets.DOCKER_HUB_TOKEN }}"
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_TOKEN" ]; then
            IMAGE="${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}"
            echo "docker_hub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "docker_hub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials absent; using GitHub Container Registry."
          fi

          # 生成标签
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_STAMP=$(git show -s --date=format-local:%Y%m%d%H%M --format=%cd "${{ github.sha }}")
          HOST_VERSION=$(node scripts/host-version.mjs --channel nightly --build-stamp "$COMMIT_STAMP" --commit "${{ github.sha }}")
          if [ -n "${{ github.event.inputs.tag }}" ]; then HOST_VERSION="${{ github.event.inputs.tag }}"; fi

          # RC releases NEVER overwrite :latest; stable and nightly retain it.
          TAGS="${IMAGE}:${SHORT_SHA}"
          if [[ "${{ github.event.inputs.tag }}" != *-rc.* ]]; then
            TAGS="${IMAGE}:latest,${TAGS}"
          fi

          # 如果是手动触发且指定了标签
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.tag }}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "docker_username=${DOCKER_USERNAME}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "host_version=${HOST_VERSION}" >> $GITHUB_OUTPUT
          echo "build_stamp=${COMMIT_STAMP}" >> $GITHUB_OUTPUT

          echo "📦 Generated tags:"
          echo "${TAGS}" | tr ',' '\n'

      - name: Generate release info
        id: release_info
        run: |
          echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && steps.tags.outputs.docker_hub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GHCR (GitHub Token fallback)
        if: github.event_name != 'pull_request' && steps.tags.outputs.docker_hub_enabled != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=tx5dr-docker
          cache-to: type=gha,scope=tx5dr-docker,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_STAMP=${{ steps.tags.outputs.build_stamp }}
            TX5DR_CLUBLOG_API_KEY=${{ secrets.CLUBLOG_API_KEY }}
          labels: |
            org.opencontainers.image.title=${{ env.DOCKER_IMAGE_NAME }}
            org.opencontainers.image.description=TX-5DR Digital Radio System
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.host_version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && steps.tags.outputs.docker_hub_enabled == 'true'
        uses: peter-evans/dockerhub-description@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ steps.tags.outputs.image }}
          readme-filepath: ./docker/README.md

      - name: Build summary
        run: |
          echo "## 🎉 Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 镜像信息" >> $GITHUB_STEP_SUMMARY
          echo "- **仓库**: \`${{ steps.tags.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **架构**: \`linux/amd64, linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: \`${{ steps.tags.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ 标签" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 使用方法" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 拉取最新镜像" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.tags.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 运行容器" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 8076:80 --name tx-5dr ${{ steps.tags.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 或使用 docker-compose" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 链接" >> $GITHUB_STEP_SUMMARY
          echo "- [Docker Hub]( https://hub.docker.com/r/${{ steps.tags.outputs.image }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Repository](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY

      - name: Create or Update Nightly Docker Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag != '' && format('{0}-docker', github.event.inputs.tag) || 'nightly-docker' }}
          name: ${{ github.event.inputs.tag != '' && format('TX-5DR Docker {0}', github.event.inputs.tag) || 'Nightly Build — Docker Image' }}
          body: |
            ## TX-5DR Nightly Build — Docker Image Docker 镜像

            **Built at** （构建时间）: ${{ steps.release_info.outputs.timestamp }}
            **Commit**: [${{ steps.tags.outputs.short_sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Image Digest**: `${{ steps.docker_build.outputs.digest }}`

            ---

            ### 🚀 Quick Start 快速启动

            ```bash
            # Pull image / 拉取镜像
            docker pull ${{ steps.tags.outputs.image }}:latest

            # Run / 启动
            docker run -d -p 8076:80 --name tx-5dr \
              ${{ steps.tags.outputs.image }}:latest

            # View admin token / 查看管理员令牌
            docker exec tx-5dr cat /app/data/config/.admin-token
            ```

            ### 📋 Docker Compose

            ```yaml
            version: '3.8'
            services:
              tx5dr:
                image: ${{ steps.tags.outputs.image }}:latest
                container_name: tx5dr
                restart: unless-stopped
                ports:
                  - "8076:80"
                volumes:
                  - ./data/config:/app/data/config
                  - ./data/logs:/app/data/logs
                  - /dev/snd:/dev/snd:rw      # Audio devices / 音频设备
                devices:
                  - /dev/bus/usb:/dev/bus/usb:rwm  # USB devices / USB 设备
                group_add:
                  - audio
            ```

            ### 🔧 Environment Variables 环境变量

            | Variable 变量 | Default 默认值 | Description 说明 |
            |---|---|---|
            | `PORT` | `4000` | Backend API port (internal) / 后端 API 端口（内部） |
            | `TX5DR_CONFIG_DIR` | `/app/data/config` | Config directory / 配置目录 |
            | `TX5DR_LOGS_DIR` | `/app/data/logs` | Log directory / 日志目录 |

            ### 🏷️ Image Tags 镜像标签
            - `latest` — always points to newest build / 始终指向最新构建
            - `${{ steps.tags.outputs.short_sha }}` — pinned to this commit / 锁定到此提交

            ### 📦 Architectures 支持架构
            - `linux/amd64` (x86_64)
            - `linux/arm64` (aarch64)

            ### 🔗 Links 链接
            - [Docker Hub](https://hub.docker.com/r/${{ steps.tags.outputs.image }})
            - [Desktop App / 桌面应用](https://github.com/${{ github.repository }}/releases/tag/nightly-app)
            - [Linux Server / 服务器版](https://github.com/${{ github.repository }}/releases/tag/nightly-server)
          allowUpdates: ${{ github.event.inputs.tag == '' }}
          artifacts: ""
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ github.event.inputs.tag == '' || contains(github.event.inputs.tag, '-rc.') }}
          makeLatest: false

      - name: Install ossutil
        if: env.OSS_ACCESS_KEY_ID != '' && env.OSS_ACCESS_KEY_SECRET != '' && env.OSS_BUCKET != '' && env.OSS_ENDPOINT != '' && env.OSS_BASE_URL != ''
        run: bash scripts/install-ossutil.sh

      - name: Configure ossutil
        if: env.OSS_ACCESS_KEY_ID != '' && env.OSS_ACCESS_KEY_SECRET != '' && env.OSS_BUCKET != '' && env.OSS_ENDPOINT != '' && env.OSS_BASE_URL != ''
        shell: bash
        run: |
          oss_region="${OSS_REGION:-}"
          oss_endpoint_host="${OSS_ENDPOINT#https://}"
          oss_endpoint_host="${oss_endpoint_host#http://}"
          oss_endpoint_host="${oss_endpoint_host%%/*}"

          if [ -z "${oss_region}" ]; then
            if [[ "${oss_endpoint_host}" =~ oss-([a-z0-9-]+)\.aliyuncs\.com$ ]]; then
              oss_region="${BASH_REMATCH[1]}"
            fi
          fi

          if [ -z "${oss_region}" ]; then
            echo "Failed to determine OSS region from OSS_ENDPOINT=${OSS_ENDPOINT}" >&2
            echo "Please configure the OSS_REGION GitHub secret, for example: cn-hangzhou" >&2
            exit 1
          fi

          echo "Using OSS endpoint: ${OSS_ENDPOINT}"
          echo "Using OSS region: ${oss_region}"
          cat > "${RUNNER_TEMP}/.ossutilconfig" <<EOF
          [Credentials]
          language = EN
          endpoint = ${OSS_ENDPOINT}
          region = ${oss_region}
          accessKeyID = ${OSS_ACCESS_KEY_ID}
          accessKeySecret = ${OSS_ACCESS_KEY_SECRET}
          EOF

      - name: Generate OSS docker manifest
        if: env.OSS_ACCESS_KEY_ID != '' && env.OSS_ACCESS_KEY_SECRET != '' && env.OSS_BUCKET != '' && env.OSS_ENDPOINT != '' && env.OSS_BASE_URL != ''
        run: |
          node scripts/generate-oss-manifest.mjs \
            --product docker \
            --channel nightly \
            --tag "nightly-docker" \
            --version "${{ steps.tags.outputs.host_version }}" \
            --commit "${{ steps.tags.outputs.short_sha }}" \
            --published-at "${{ steps.release_info.outputs.timestamp }}" \
            --base-url "${OSS_BASE_URL}" \
            --object-prefix "tx-5dr/docker/nightly-docker" \
            --output "oss-metadata/docker/latest.json" \
            --docker-image "${{ steps.tags.outputs.image }}" \
            --docker-tags "${{ steps.tags.outputs.tags }}" \
            --docker-digest "${{ steps.docker_build.outputs.digest }}"

      - name: Upload docker metadata to OSS
        if: env.OSS_ACCESS_KEY_ID != '' && env.OSS_ACCESS_KEY_SECRET != '' && env.OSS_BUCKET != '' && env.OSS_ENDPOINT != '' && env.OSS_BASE_URL != ''
        run: |
          ossutil cp "oss-metadata/docker/latest.json" "oss://${OSS_BUCKET}/tx-5dr/docker/nightly-docker/latest.json" --force -c "${RUNNER_TEMP}/.ossutilconfig"
          ossutil cp "oss-metadata/docker/latest.json" "oss://${OSS_BUCKET}/tx-5dr/docker/latest.json" --force -c "${RUNNER_TEMP}/.ossutilconfig"
